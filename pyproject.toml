[project]
name = "searchy"
version = "0.1.0"
description = "Demo-first ACO project: pheromone-learning search agent + canonical TSP benchmarks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pandas>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]